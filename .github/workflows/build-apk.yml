name: Build Android APK

# 触发（节省 Actions 配额策略）：
#   push tag v*                      → 必定构建 + 签名 + 创建 GitHub Release
#   workflow_dispatch                → 手动触发，可勾"签名 / 发布 Release"
#   pull_request（非 Draft）         → 使用公开开发密钥签名
#   schedule（每周一）               → 刷新 main 上 deps/Qt/ccache/Gradle 基线缓存，防止 7 天过期与 PR 冷编
#   push 到 main（提交含 [build-apk]） → 显式请求构建（普通代码/文档 push 跳过不计费）
on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
    tags: ['v*']
    # tag push 不受 paths 过滤影响，发版必定触发。
    paths:
      - 'obs-studio/**'
      - '!obs-studio/**/*.md'
      - '!obs-studio/docs/**'
      - '!obs-studio/.github/**'
      - '!obs-studio/plugins/win-*/**'
      - '!obs-studio/plugins/mac-*/**'
      - '!obs-studio/plugins/linux-*/**'
      - 'deps-android/**'
      - '!deps-android/**/*.md'
      - 'scripts/**'
      - '!scripts/**/*.md'
      - '!scripts/build-frontend-apk-windows.ps1'
      - '!scripts/build-deps-windows.sh'
      - '!scripts/build-frontend-apk-wsl.sh'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'obs-studio/**'
      - '!obs-studio/**/*.md'
      - '!obs-studio/docs/**'
      - '!obs-studio/.github/**'
      - '!obs-studio/plugins/win-*/**'
      - '!obs-studio/plugins/mac-*/**'
      - '!obs-studio/plugins/linux-*/**'
      - 'deps-android/**'
      - '!deps-android/**/*.md'
      - 'scripts/**'
      - '!scripts/**/*.md'
      - '!scripts/build-frontend-apk-windows.ps1'
      - '!scripts/build-deps-windows.sh'
      - '!scripts/build-frontend-apk-wsl.sh'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      sign:
        description: '用 Secrets 里的密钥签名（需先配好 4 个 Secrets）'
        type: boolean
        default: true
      create_release:
        description: '构建成功后创建 GitHub Release 并上传 APK'
        type: boolean
        default: false

# 同一 ref 的重复触发取消旧任务。tag 不取消：避免发出半截 Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build arm64-v8a APK
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]'))
    # Ubuntu 24.04：自带 NDK r30、Android SDK (36/36.0.0) 与 CMake 3.31.6。
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # 只在打 tag 或手动勾选发布时用到 contents:write 创建 Release。
    permissions:
      contents: write

    env:
      DL_ROOT: ${{ github.workspace }}/../obs-dl

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Load toolchain versions
        run: |
          set -euo pipefail
          while IFS='=' read -r k v || [ -n "$k" ]; do
            case "$k" in ''|'#'*) continue ;; esac
            echo "$k=$v" >> "$GITHUB_ENV"
          done < scripts/toolchain-versions.env
          source scripts/toolchain-versions.env
          echo "PLATFORM=android-$COMPILE_SDK_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"

      # ---- 先恢复预编依赖缓存，据此决定需要安装哪些宿主包 ----
      - name: Compute dependency cache key
        id: depkey
        run: |
          set -euo pipefail
          HASH="$( { find deps-android -maxdepth 1 -type f -name '*.sh'; \
                     find scripts/android-native-deps -maxdepth 1 -type f; \
                     echo scripts/relocate-android-pkgconfig.sh; } \
                   | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -c1-16 )"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "依赖缓存键哈希=$HASH"

      - name: Cache prebuilt dependencies
        id: deps_cache
        uses: actions/cache@v5
        with:
          path: deps-android/prebuilt
          key: obsdeps-v3-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ steps.depkey.outputs.hash }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install host build tools
        timeout-minutes: 10
        env:
          DEPS_CACHE_HIT: ${{ steps.deps_cache.outputs.cache-hit }}
        run: |
          # 命中 obsdeps-v3 时无需构建第三方依赖，只装 OBS 主构建与 Qt 打包所需的最小工具集；
          # 并先检查 dpkg 状态，若全部已存在则跳过 apt-get update。
          host_packages=(
            ninja-build ccache
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev
          )
          if [ "${DEPS_CACHE_HIT:-}" != "true" ]; then
            host_packages+=(
              7zip meson build-essential curl unzip zip ca-certificates
              patch pkg-config dpkg-dev autoconf automake libtool
            )
          fi
          missing=()
          for pkg in "${host_packages[@]}"; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "所有必需宿主包均已就位，跳过 apt-get"
          else
            echo "需要安装的宿主包：${missing[*]}"
            apt_network_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            fetch_host_packages() {
              sudo timeout -k 5s 90s apt-get "${apt_network_options[@]}" update --error-on=any &&
                sudo timeout -k 5s 150s apt-get "${apt_network_options[@]}" install \
                  -y --no-install-recommends --download-only "${missing[@]}"
            }
            if ! fetch_host_packages; then
              echo "::warning::Ubuntu mirror update or download failed. Retrying with archive.ubuntu.com."
              sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
              fetch_host_packages
            fi
            sudo apt-get install -y --no-install-recommends --no-download "${missing[@]}"
          fi
          if [ "${DEPS_CACHE_HIT:-}" != "true" ]; then
            for c in 7z 7zz 7za 7zr; do command -v "$c" >/dev/null 2>&1 && { echo "7-Zip: $c"; break; }; done
            autoreconf --version | head -1
          fi

      - name: Cache Qt toolchain
        uses: actions/cache@v5
        with:
          path: ~/Qt
          key: obsqt-v3-${{ runner.os }}-qt${{ env.QT_VERSION }}

      - name: Install Qt toolchain
        run: |
          set -euo pipefail
          QT_DIR="$HOME/Qt/$QT_VERSION"
          if [ ! -x "$QT_DIR/gcc_64/bin/androiddeployqt" ] || [ ! -d "$QT_DIR/android_arm64_v8a" ]; then
            pip install --quiet aqtinstall
            mkdir -p "$HOME/Qt"
            aqt install-qt all_os android "$QT_VERSION" android_arm64_v8a -O "$HOME/Qt"
            aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/Qt"
          fi
          [ -x "$QT_DIR/gcc_64/bin/androiddeployqt" ] && [ -d "$QT_DIR/android_arm64_v8a" ] || {
            echo "FATAL: Qt $QT_VERSION 工具链不完整（$QT_DIR）" >&2
            exit 1
          }
          QTBASE_ARCHIVE="$QT_DIR/qtbase-v$QT_VERSION.tar.gz"
          if [ ! -s "$QTBASE_ARCHIVE" ]; then
            curl -fL --retry 3 --retry-delay 5 -o "$QTBASE_ARCHIVE.tmp" \
              "https://codeload.github.com/qt/qtbase/tar.gz/refs/tags/v$QT_VERSION"
            mv "$QTBASE_ARCHIVE.tmp" "$QTBASE_ARCHIVE"
          fi

      # ---- ccache：仅缓存 OBS 主构建（≤512M）；PR 只读不回写，防挤爆 10 GB 配额淘汰 deps/Qt ----
      - name: Restore ccache objects
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: obsccache-v2-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-qt${{ env.QT_VERSION }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            obsccache-v2-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-qt${{ env.QT_VERSION }}-

      # 独立一步恢复密钥：这样"有没有密钥"的判断只在一处，构建步骤里不再套条件表达式。
      - name: Restore signing keystore from secrets
        id: keystore
        if: |
          github.event_name != 'pull_request' &&
          github.event_name != 'schedule' &&
          (github.event_name != 'workflow_dispatch' || inputs.sign)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64 —— 本次将只产出未签名 APK"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tr -d 去掉换行：粘贴 Secrets 时很容易带回车，解码出来就是坏文件。
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          # 立刻验一次：口令错/文件坏在这里暴露，而不是等到最后签名那一步。
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env STORE_PASS \
            -alias "$KEY_ALIAS" >/dev/null
          echo "密钥库可用"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          SIGN_KEYSTORE: ${{ (github.event_name == 'pull_request' || github.event_name == 'schedule') && format('{0}/scripts/signing/debug.keystore', github.workspace) || (steps.keystore.outputs.available == 'true' && format('{0}/release.jks', runner.temp) || '') }}
          SIGN_KEY_ALIAS: ${{ (github.event_name == 'pull_request' || github.event_name == 'schedule') && 'androiddebugkey' || secrets.ANDROID_KEY_ALIAS }}
          SIGN_STORE_PASS: ${{ (github.event_name == 'pull_request' || github.event_name == 'schedule') && 'android' || secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGN_KEY_PASS: ${{ (github.event_name == 'pull_request' || github.event_name == 'schedule') && 'android' || secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci-build-android.sh

      - name: Save ccache objects
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: obsccache-v2-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-qt${{ env.QT_VERSION }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Locate APK and checksum
        id: apk
        run: |
          set -euo pipefail
          # 脚本把最终产物路径写在这个文件里（签名过就是签名包，否则是未签名包）。
          APK_FILE="$(cat build-fe-arm64-v8a-ci/.final-apk-path)"
          [ -f "$APK_FILE" ] || { echo "FATAL: 路径文件指向的 APK 不存在：$APK_FILE"; exit 1; }
          SHA="$(sha256sum "$APK_FILE" | cut -d' ' -f1)"
          SIZE="$(stat -c %s "$APK_FILE")"
          # 判定"是否签名"要按**文件名精确比对**，不能用 *release.apk 这类通配：
          # 未签名包的路径里也常含 "release"（.../outputs/apk/release/xxx-unsigned.apk），
          # 通配会把未签名的包误判成已签名，进而把一个装不上的包发成 Release。
          SIGNED="no"
          if [ "$(basename "$APK_FILE")" = "OBS-Android-arm64-v8a-release.apk" ]; then
            SIGNED="yes"
          fi
          {
            echo "path=$APK_FILE"
            echo "name=$(basename "$APK_FILE")"
            echo "sha256=$SHA"
            echo "signed=$SIGNED"
          } >> "$GITHUB_OUTPUT"
          echo "APK       : $APK_FILE"
          echo "SHA-256   : $SHA"
          echo "签名      : $SIGNED"
          {
            echo "### APK 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 文件 | \`$(basename "$APK_FILE")\` |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| 大小 | $SIZE 字节 |"
            echo "| 已签名 | $SIGNED |"
            echo "| ABI / API | arm64-v8a / minSdk 29 |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Release 资产不计入 Actions Artifact 500 MB 存储配额，发版及定时缓存预热均跳过重复的 artifact 上传。
      - name: Upload APK artifact
        if: |
          github.event_name != 'schedule' &&
          !(steps.apk.outputs.signed == 'yes' &&
            (startsWith(github.ref, 'refs/tags/v') ||
             (github.event_name == 'workflow_dispatch' && inputs.create_release)))
        uses: actions/upload-artifact@v4
        with:
          name: obs-android-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Create GitHub Release
        # 只在打 v* tag 时发布（手动触发要先勾 create_release）；
        # 且必须真的签过名 —— 发一个装不上的包比不发更糟。
        if: |
          steps.apk.outputs.signed == 'yes' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.event_name == 'workflow_dispatch' && inputs.create_release))
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            OBS for Android —— arm64-v8a 自签名 release 包（用仓库维护者自己的密钥签名）。

            | 项 | 值 |
            | --- | --- |
            | 文件 | `${{ steps.apk.outputs.name }}` |
            | SHA-256 | `${{ steps.apk.outputs.sha256 }}` |

            安装：`adb install -r <apk>`。此包与仓库里的 debug 测试包**签名不同**，
            覆盖安装前请先备份配置（跨签名升级需要先卸载，用户数据会丢）。

            未在真机验证的范围见仓库 README 的 Limitations 一节。
          fail_on_unmatched_files: true

      # ---- 失败诊断：生成摘要并与构建日志合并单包上传 ----
      - name: 失败时诊断
        if: failure()
        run: |
          {
            echo "=== Qt 目录 ==="
            ls -1 "$HOME/Qt" 2>/dev/null || true
            echo "=== SDK 平台 / build-tools ==="
            for sdk_dir in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
              [ -d "$sdk_dir" ] || continue
              echo "--- $sdk_dir ---"
              ls -1 "$sdk_dir/platforms" "$sdk_dir/build-tools" 2>/dev/null || true
              break
            done
            echo "=== CMake 配置日志尾部 ==="
            for f in build-fe-*/CMakeFiles/CMakeConfigureLog.yaml build-fe-*/CMakeFiles/CMakeError.log; do
              [ -f "$f" ] || continue
              echo "--- $f"
              tail -n 60 "$f" || true
            done
            echo "=== deployment settings ==="
            for f in build-fe-*/frontend/android-*-deployment-settings.json; do
              [ -f "$f" ] || continue
              echo "--- $f"
              grep -E 'android-platform|sdk|target|min' "$f" || true
            done
            echo "=== 磁盘 ==="
            df -h / 2>/dev/null || true
            du -sh "$HOME/Qt" "$DL_ROOT" 2>/dev/null || true
          } | tee diagnostics.txt
          echo "::group::失败诊断摘要"
          cat diagnostics.txt
          echo "::endgroup::"

      - name: 失败时上传构建日志与诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_attempt }}
          path: |
            diagnostics.txt
            build-fe-*/CMakeFiles/CMakeConfigureLog.yaml
            build-fe-*/CMakeCache.txt
            build-fe-*/CMakeFiles/CMakeOutput.log
            build-fe-*/CMakeFiles/CMakeError.log
            build-fe-*/frontend/android-*-deployment-settings.json
            build-fe-*/frontend/android-build/build.gradle
            build-fe-*/frontend/android-build/build/outputs/logs/*.txt
            build-fe-*/.final-apk-path
          if-no-files-found: warn
          retention-days: 3
