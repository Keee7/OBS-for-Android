Transparent="Transparent background"
Transparent.Description="Let the page's transparent areas show the scene behind it. Pages that paint their own opaque background stay opaque. Enabling this switches the display to an ImageReader output and samples it through an EGLImage, so alpha survives the compositor without any CPU copy."
AlphaMode="Alpha handling"
AlphaMode.Compat="Compatible (default)"
AlphaMode.Straight="Keep alpha (straight input)"
AlphaMode.Premultiplied="Keep alpha (premultiplied input)"
AlphaMode.Description="Only affects how captured alpha is drawn. Compatible forces premultiplied drawing in the legacy non-linear pipeline; the two Keep alpha entries match the screen-capture source's modes and only change the edge/colour maths, not whether the compositor delivers transparency at all."
