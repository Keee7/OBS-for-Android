BrowserSource="安卓浏览器"
LocalFile="本地文件"
HTMLFileFilter="HTML 文件"
XHTMLFileFilter="XHTML 文件"
AllFilesFilter="所有文件"
URL="网址"
Width="宽度"
Height="高度"
FPS="最高帧率"
DesktopMode="请求桌面版网页"
DesktopMode.Description="开启后发送桌面端 User-Agent 与 Client Hints（非移动端标识），并将虚拟显示密度设为 160 dpi（1:1 逻辑视口，与桌面版 OBS 一致），避免手机/平板高 DPI 导致网页被迫窄屏竖排。切换后会重新加载网页。"
FitWidth="适应宽度"
FitWidth.Description="启用宽视口与概览缩放（useWideViewPort + loadWithOverviewMode），用于让固定超宽排版的旧网页完整缩进源宽度内。默认关闭，避免影响正常响应式页面和直播挂件。"
Transparent="透明背景"
Transparent.Description="网页的透明区域会透出下层场景；网页自己画了不透明背景时仍保持不透明。打开后虚拟显示改用 ImageReader 输出面并经 EGLImage 采样，alpha 能穿过合成器，且不产生 CPU 拷贝。"
AlphaMode="透明度处理"
AlphaMode.Compat="兼容（默认）"
AlphaMode.Straight="保留 Alpha（直通输入）"
AlphaMode.Premultiplied="保留 Alpha（预乘输入）"
AlphaMode.Description="只影响采集到的 Alpha 怎么画。兼容模式强制按预乘处理、沿用旧的非线性管线；两个“保留 Alpha”与屏幕采集源同名同义，只改边缘和颜色的算法，不改变合成器是否交付透明度。"
CSS="自定义 CSS"
RerouteAudio="通过 OBS 控制音频"
RerouteAudio.Description="将支持的网页音频接入 OBS 混音器。切换此选项会重新加载网页。跨域媒体需要服务器允许跨域访问。"
Refresh="刷新"
StatusStarting="浏览器正在启动；重新打开属性可刷新状态。"
StatusReceiving="浏览器正在接收画面；重新打开属性可刷新状态。"
StatusRetrying="浏览器启动失败或图形表面丢失，正在重试；请查看 OBS 和安卓日志。重新打开属性可刷新状态。"
