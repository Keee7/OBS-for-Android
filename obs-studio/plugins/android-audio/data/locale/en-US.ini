Device.Description="System Default Input lets Android pick the microphone. If a selected USB/external audio device replugs with a new ID, OBS tries to rematch it by product name and falls back to System Default if missing."
SampleRate.Description="0 lets Android decide the sample rate. If the device rejects custom sample rate or channel count settings, AAudio automatically falls back to system defaults (PCM 16-bit or float32) to open the stream."
SharingMode.Description="Exclusive requests single-client direct access for lower latency, but Android HAL/AudioPolicy may silently downgrade it to Shared."
PerformanceMode.Description="Low Latency is an advisory preference that Android may downgrade depending on hardware and audio path support. Power Saving is treated as None for input streams."
MmapPolicy.Description="Requires Android API 36+ and HAL support. On older Android versions or unsupported paths, the MMAP request is ignored and the system default path is used."
