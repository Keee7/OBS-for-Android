AAudioInput="AAudio 音频输入（Android 麦克风）"
Device="音频输入设备"
Device.DefaultNoBus="系统默认输入（音频总线未接通）"
Device.DefaultParseFailed="系统默认输入（设备快照解析失败）"
Device.DefaultNoDevices="系统默认输入（当前没有音频输入设备；未授予 RECORD_AUDIO 时清单可能为空）"
Device.DefaultAuto="系统默认输入（自动）"
SampleRate="请求采样率（Hz，0 = 交给系统）"
Channels="请求声道数（1 或 2）"
InputPreset="输入预设"
InputPreset.Generic="generic（通用）"
InputPreset.Camcorder="camcorder（摄像机，带自动增益/降噪）"
InputPreset.VoiceRecognition="voice_recognition（语音识别，尽量原样）"
InputPreset.VoiceCommunication="voice_communication（通话，走回声消除）"
InputPreset.Unprocessed="unprocessed（不做任何处理）"
SharingMode="共享模式"
SharingMode.Shared="shared（共享，由 AudioFlinger 混音，采样率/格式可能被调整）"
SharingMode.Exclusive="exclusive（独占，延迟最低；同一设备仅限单个客户端）"
PerformanceMode="性能模式"
PerformanceMode.None="none（不作特别要求）"
PerformanceMode.LowLatency="low_latency（优先低延迟）"
PerformanceMode.PowerSaving="power_saving（省电；输入流不支持，按 none 处理）"
MmapPolicy="MMAP 路径（Android API 36 起支持，按系统能力启用）"
MmapPolicy.Unspecified="unspecified（保持系统默认）"
MmapPolicy.Never="never（强制走传统路径）"
MmapPolicy.Auto="auto（支持时使用 MMAP，否则回落）"
MmapPolicy.Always="always（必须使用 MMAP）"
