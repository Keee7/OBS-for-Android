AAudioInput="AAudio 音訊輸入（Android 麥克風）"
Device="音訊輸入裝置"
Device.DefaultNoBus="系統預設輸入（音訊匯流排未連線）"
Device.DefaultParseFailed="系統預設輸入（裝置快照解析失敗）"
Device.DefaultNoDevices="系統預設輸入（找不到音訊輸入裝置；請檢查 RECORD_AUDIO 權限）"
Device.DefaultAuto="系統預設輸入（自動）"
SampleRate="請求取樣率（Hz，0 = 交由系統決定）"
Channels="請求聲道數（1 或 2）"
InputPreset="輸入預設集"
InputPreset.Generic="generic（一般用途）"
InputPreset.Camcorder="camcorder（攝影機，含自動增益與降噪）"
InputPreset.VoiceRecognition="voice_recognition（語音辨識，盡量保持原樣）"
InputPreset.VoiceCommunication="voice_communication（通話，啟用回音消除）"
InputPreset.Unprocessed="unprocessed（未經處理的原始音訊）"
SharingMode="共用模式"
SharingMode.Shared="shared（共用，由 AudioFlinger 混音，取樣率/格式可能變更）"
SharingMode.Exclusive="exclusive（獨佔，最低延遲；同時僅限單一用戶端）"
PerformanceMode="效能模式"
PerformanceMode.None="none（無特殊偏好）"
PerformanceMode.LowLatency="low_latency（優先低延遲）"
PerformanceMode.PowerSaving="power_saving（省電；輸入串流不支援，將視為 none）"
MmapPolicy="MMAP 路徑（Android API 36+，支援時套用）"
MmapPolicy.Unspecified="unspecified（使用系統預設）"
MmapPolicy.Never="never（強制使用傳統路徑）"
MmapPolicy.Auto="auto（可用時使用 MMAP）"
MmapPolicy.Always="always（必須使用 MMAP）"
Device.Description="「系統預設輸入」會交由 Android 自動選擇麥克風。若指定的 USB 外接音效卡重新插拔後裝置 ID 變更，將嘗試依產品名稱重新配對；找不到時自動回退至系統預設輸入。"
SampleRate.Description="設為 0 表示交由系統決定。若裝置不支援所填取樣率或聲道數導致開啟失敗，外掛程式會自動回退至系統預設參數（PCM 16-bit 或 float32）重試。"
SharingMode.Description="「exclusive（獨佔）」會向系統申請低延遲直通，但受硬體或音訊原則限制時 Android 可能自動降級為「shared（共用）」模式。"
PerformanceMode.Description="「low_latency（低延遲）」僅為效能偏好提示，不支援時系統會降級為一般模式；輸入串流選擇「power_saving（省電）」時系統會按「none」處理。"
MmapPolicy.Description="MMAP 控制需要 Android API 36+ 且底層 HAL 支援；在較舊系統或未支援的裝置上會自動忽略並回落至系統預設音訊路徑。"
