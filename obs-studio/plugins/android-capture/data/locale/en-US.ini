YuvPassthrough.Description="Applies to YUYV, UYVY, NV12, and P010. Strictly keeps the selected uncompressed YUV format, resolution, and frame rate without falling back to MJPEG or lower modes, and checks USB link bandwidth. Turn off to allow automatic compatibility negotiation."
YuvUnbuffered="Low-latency direct output"
YuvUnbuffered.Description="Off by default. Displays the newest frame immediately to reduce latency, disabling frame buffering, timestamp smoothing, and A/V sync (may cause slight stutter or A/V drift)."

