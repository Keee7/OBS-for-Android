YuvPassthrough="锁定所选 YUV 档位（禁止自动回退）"
YuvPassthrough.Description="适用于 YUYV、UYVY、NV12 和 P010。开启后会严格保持所选未压缩 YUV 格式、分辨率与帧率（不自动改用 MJPEG 或降级），并启用 USB 带宽预检；关闭后在设备不支持时允许自动协商兼容档位。"
YuvUnbuffered="低延迟直出"
YuvUnbuffered.Description="默认关闭。开启后直出最新帧以降低延迟，但会关闭帧缓冲、时间戳平滑与音画同步，可能导致轻微卡顿或音画偏移。"

